# Europa fisica

## 1. Posizione e caratteristiche generali
- **Cos'è l'Europa?**
  - Una grande penisola che fa parte del supercontinente Eurasia.
- **Confini naturali**
  - **Nord:** Mar Glaciale Artico
  - **Ovest:** Oceano Atlantico
  - **Sud:** Mar Mediterraneo e Mar Nero
  - **Est:** Monti Urali e catena del Caucaso (confine convenzionale con l'Asia).
- **Perché è un continente a sé?**
  - Soprattutto per storia, cultura ed economia che i popoli europei hanno condiviso nei secoli.
- **Un continente antropizzato**
  - Il continente più modificato e sfruttato dall'uomo per città, industrie, agricoltura e vie di comunicazione.

## 2. Montagne
- L'aspetto delle montagne europee dipende dalla loro età.
- **Antiche (a Nord)**
  - Si sono formate centinaia di milioni di anni fa.
  - Sono più basse e con cime arrotondate a causa della lunga erosione.
  - *Esempi:* Alpi Scandinave.
- **Giovani (a Sud)**
  - Si sono formate in epoche più recenti (circa 60 milioni di anni fa).
  - Sono più alte e con cime appuntite.
  - *Esempi:* Alpi (Monte Bianco, 4810 m slm), Pirenei, Carpazi, Balcani e Caucaso (Monte Elbrus, 5642 m slm).
- **Rischio sismico e vulcanico**
  - Le aree più attive sono l'Islanda e la zona del Mediterraneo (es. Etna e Vesuvio in Italia).

## 3. Pianure
- L'altitudine media europea è bassa (circa 300 m slm)
  - Le pianure sono molto estese.
- **Grandi pianure del Nord**
  - Sono le più vaste, di origine glaciale.
  - Formano un'unica, enorme area pianeggiante dagli Urali all'Atlantico.
  - *Esempio principale:* Bassopiano Sarmatico.
- **Pianure del Sud**
  - Sono di origine alluvionale.
  - Sono meno estese ma molto fertili.
  - *Esempi:* Pianura Padana, Pianura Ungherese.
- **Polder**
  - Nei Paesi Bassi, sono terreni "strappati" al mare attraverso dighe e canali.
  - Si trovano sotto il livello del mare.

## 4. Fiumi e laghi
- **Fiumi**
  - L'Europa è ricca di fiumi, molti dei quali sono navigabili e importanti vie di comunicazione.
  - Principali
    - **Volga**
      - Il fiume più lungo d'Europa, sfocia nel Mar Caspio.
    - **Danubio**
      - Il secondo più lungo, attraversa molte capitali e sfocia nel Mar Nero.
    - **Reno**
      - Fiume fondamentale per l'economia del centro Europa, sfocia nel Mare del Nord.
- **Laghi**
  - La maggior parte dei grandi laghi europei si trova nel Nord Europa ed è di origine glaciale.
  - I più grandi sono i laghi Ladoga e Onega in Russia.
  - Il **Mar Caspio** è il lago più grande del mondo, ma è salato perché è ciò che resta di un antico mare.

## 5. Mari e coste
- L'Europa è il continente con lo sviluppo costiero più lungo in rapporto alla sua superficie.
  - Le coste sono molto frastagliate
- **Mari principali**
  - **Mar Glaciale Artico (Nord)**
    - Ghiacciato per gran parte dell'anno.
  - **Oceano Atlantico (Ovest)**
    - Caratterizzato da maree forti. La Corrente del Golfo ne mitiga il clima sulle coste.
  - **Mar Mediterraneo (Sud)**
    - Un mare quasi chiuso, con acque più calde e salate e maree deboli.
- **Tipi di coste**
  - **Fiordi**
    - Tipici della Norvegia. Sono antiche valli glaciali invase dal mare, strette e profonde.
  - **Coste basse e sabbiose**
    - Comuni lungo l'Atlantico e il Mare del Nord.
  - **Coste alte e rocciose**
    - Presenti in Irlanda (scogliere), Francia e in molte zone del Mediterraneo.
- **Problemi dei mari**
  - Inquinamento, pesca eccessiva e cementificazione delle coste.
